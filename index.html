<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- iOS PWA / home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="旅程規劃" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme -->
    <meta name="theme-color" content="#18181b" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>旅程規劃助手</title>

    <!-- Google Identity Services, loaded here rather than on demand.
         requestAccessToken() opens a popup, and Chrome only allows that while
         the user's click is still "active". Fetching this script inside the
         click handler spends that activation on the network wait, so the popup
         is blocked silently - no error, no callback, just a button that spins
         forever. Loading it up front keeps the click path synchronous. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
